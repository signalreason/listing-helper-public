name: ebay-listing-helper
region: sfo
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
services:
  - name: web
    environment_slug: python
    github:
      repo: YOUR_GITHUB_OWNER/YOUR_REPOSITORY
      branch: main
      deploy_on_push: false
    source_dir: /
    run_command: bin/start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    envs:
      - key: DATABASE_URL
        value: ${accounts-db.DATABASE_URL}
        scope: RUN_TIME
        type: GENERAL
      - key: OPENAI_MODEL
        value: gpt-5.5
        scope: RUN_TIME
        type: GENERAL
      - key: EBAY_ENVIRONMENT
        value: sandbox
        scope: RUN_TIME
        type: GENERAL
      - key: EBAY_DIRECT_PUBLISH_ENABLED
        value: "false"
        scope: RUN_TIME
        type: GENERAL
databases:
  - name: accounts-db
    engine: PG
    version: "17"
    production: false
